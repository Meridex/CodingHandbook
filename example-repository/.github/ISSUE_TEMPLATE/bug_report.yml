name: Bug Report
description: Report an incorrect result, crash, or unexpected behaviour
labels: ["type: bugfix"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Fill in all sections — incomplete reports are hard to act on.

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear, concise description of the problem.
      placeholder: "When I run X with parameter Y, the output is Z but I expected W."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Numbered steps or exact commands to reproduce.
      placeholder: |
        1. Run `python examples/basic_usage.py`
        2. Observe incorrect output on line 3
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour / Error Message
      description: Include the full error message or output (use a code block).
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, relevant package versions.
      placeholder: "macOS 14, Python 3.11.4, numpy 1.26.0"
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Relevant Commit or Tag
      description: Which commit or branch were you using?
      placeholder: "main @ a1b2c3d or v0.1.0"
    validations:
      required: false

  - type: textarea
    id: possible_cause
    attributes:
      label: Possible Cause
      description: If you have a hypothesis about what is wrong, describe it here.
    validations:
      required: false
