name: Feature Request
description: Propose a new feature, method, or improvement
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to propose a new feature or calculation.

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this feature needed? What physics problem does it solve?
    validations:
      required: true

  - type: textarea
    id: proposed_implementation
    attributes:
      label: Proposed Implementation
      description: How might this be implemented? Be as specific as you can.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches were considered and why were they not chosen?
    validations:
      required: false

  - type: input
    id: paper_link
    attributes:
      label: Related Paper or Calculation
      description: Is this related to a paper, arXiv preprint, or specific calculation?
      placeholder: "e.g. arXiv:2301.12345 or 'needed for stability analysis section'"
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High (blocking paper / deadline)
        - Medium (needed for completeness)
        - Low (nice to have)
    validations:
      required: true
