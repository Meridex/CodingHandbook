[metadata]
name = phys_toolkit
version = 0.1.0
description = Simple scalar field utilities for Git workflow practice
author = NNU-PP Research Group

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10

[options.packages.find]
where = src

[options.extras_require]
test =
    pytest>=7.0
plot =
    matplotlib>=3.5
    numpy>=1.24
